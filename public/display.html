<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaAffari Tuoi - Schermo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        body { 
            margin: 0; 
            background: #000a1a; 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            padding: 0 50px;
        }
        
        /* BRANDING */
        .titolo-logo {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.5em;
            font-weight: 900;
            color: #ffd700; /* Oro */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.8), 2px 2px 0px #ffaa00;
            z-index: 10;
        }

        .firma-watermark {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 1.5em;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            z-index: 10;
        }

        /* OVERLAY SBLOCCO AUDIO (Risolve il problema del blocco browser) */
        #sblocco-audio {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .btn-sblocco {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            background: #cc0000;
            color: white;
            border: 3px solid white;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(200,0,0,0.5);
        }

        #webcam-bg { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            object-fit: cover; 
            z-index: -1; 
            opacity: 0.6; 
        }

        .colonna-premi {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            z-index: 1;
            width: 250px;
            height: 80vh; /* Permette la compressione verticale */
        }

        .premio-box {
            background: linear-gradient(to right, #004488, #0066cc);
            border: 2px solid #00aaff;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        .colonna-premi.rossi .premio-box {
            background: linear-gradient(to right, #880000, #cc0000);
            border-color: #ff3333;
        }

        .premio-eliminato {
            background: #222 !important;
            border-color: #444 !important;
            color: #555 !important;
            text-shadow: none;
            box-shadow: none;
        }

        /* GESTIONE MODALITA' VISUALIZZAZIONE DA REGIA */
        body.mode-nascosto .colonna-premi {
            display: none !important;
        }
        body.mode-restanti .premio-eliminato {
            display: none !important;
        }

        .area-centrale {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        #azione-corrente {
            font-size: 5em;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px #ffaa00, 3px 3px 10px black;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 20px;
            border: 3px solid #ffd700;
            display: none;
        }
        
        #azione-corrente.mostra {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        #banner-offerta {
            display: none;
            background: linear-gradient(to bottom, #eeeeee, #cccccc);
            border: 10px solid #222;
            border-radius: 15px;
            padding: 30px 60px;
            color: #cc0000;
            font-size: 6em;
            font-weight: 900;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 0.5s ease;
        }

        #banner-offerta.mostra {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .etichetta-offerta {
            font-size: 0.3em;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        audio { display: none; }
    </style>
</head>
<body class="mode-tutti">

    <!-- Schermata iniziale obbligatoria per sbloccare l'audio -->
    <div id="sblocco-audio">
        <h1 style="color:white; margin-bottom: 30px;">Pronto per andare in onda!</h1>
        <button class="btn-sblocco" onclick="inizializzaAudio()">CLICCA QUI PER INIZIARE E ATTIVARE L'AUDIO</button>
    </div>

    <!-- Branding -->
    <div class="titolo-logo">MegaAffari Tuoi</div>
    <div class="firma-watermark">Nicola Roberto</div>

    <video id="webcam-bg" autoplay muted></video>

    <div class="colonna-premi blu" id="col-blu"></div>

    <div class="area-centrale">
        <div id="azione-corrente"></div>
        <div id="banner-offerta">
            <div class="etichetta-offerta">Il Dottore Offre</div>
            <span id="cifra-offerta"></span>
        </div>
    </div>

    <div class="colonna-premi rossi" id="col-rossa"></div>

    <!-- AUDIO -->
    <audio id="audio-sigla" src="sigla.mp3"></audio>
    <audio id="audio-telefono" src="telefono.mp3"></audio>
    <audio id="audio-suspense" src="suspense.mp3"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const formatEuro = (num) => "€ " + num.toLocaleString('it-IT');
        const premiBlu = [0, 1, 5, 10, 20, 50, 100, 200, 500, 1000];
        const premiRossi = [5000, 10000, 15000, 20000, 30000, 50000, 75000, 100000, 200000, 300000];

        // Funzione fondamentale per l'audio: sblocca il browser
        function inizializzaAudio() {
            document.getElementById('sblocco-audio').style.display = 'none';
            // Suona a volume zero un audio per sbloccare il contesto audio
            const dummySound = document.getElementById('audio-telefono');
            dummySound.volume = 0;
            dummySound.play().then(() => {
                dummySound.pause();
                dummySound.currentTime = 0;
                dummySound.volume = 1;
            }).catch(e => console.log("Errore sblocco:", e));
        }

        function creaTabellone() {
            const colBlu = document.getElementById('col-blu');
            const colRossa = document.getElementById('col-rossa');
            colBlu.innerHTML = ''; colRossa.innerHTML = '';

            premiBlu.forEach(val => {
                colBlu.innerHTML += `<div class="premio-box" id="premio-${val}">${formatEuro(val)}</div>`;
            });
            premiRossi.forEach(val => {
                colRossa.innerHTML += `<div class="premio-box" id="premio-${val}">${formatEuro(val)}</div>`;
            });
        }
        creaTabellone();

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { document.getElementById('webcam-bg').srcObject = stream; })
            .catch(err => console.error("Webcam non trovata"));

        const socket = io();

        // Cambio modalità display
        socket.on('set-display-mode', (mode) => {
            document.body.className = mode;
        });

        socket.on('display-apri-pacco', (pacco) => {
            document.getElementById('banner-offerta').classList.remove('mostra');
            setTimeout(() => document.getElementById('banner-offerta').style.display = 'none', 500);

            const elementoPremio = document.getElementById(`premio-${pacco.valore}`);
            if(elementoPremio) {
                elementoPremio.classList.add('premio-eliminato');
            }

            const azioneDiv = document.getElementById('azione-corrente');
            azioneDiv.style.display = 'block';
            azioneDiv.innerText = formatEuro(pacco.valore);
            setTimeout(() => azioneDiv.classList.add('mostra'), 50);
            
            setTimeout(() => {
                azioneDiv.classList.remove('mostra');
                setTimeout(() => azioneDiv.style.display = 'none', 800);
            }, 5000);
        });

        socket.on('display-mostra-offerta', (cifra) => {
            const banner = document.getElementById('banner-offerta');
            document.getElementById('cifra-offerta').innerText = formatEuro(Number(cifra));
            banner.style.display = 'block';
            setTimeout(() => banner.classList.add('mostra'), 50);
        });

        socket.on('display-nascondi-offerta', () => {
            const banner = document.getElementById('banner-offerta');
            banner.classList.remove('mostra');
            setTimeout(() => banner.style.display = 'none', 500);
        });

        socket.on('play-audio', (tipo) => {
            const audioMap = {
                'sigla': document.getElementById('audio-sigla'),
                'telefono': document.getElementById('audio-telefono'),
                'suspense': document.getElementById('audio-suspense')
            };
            const sound = audioMap[tipo];
            if(sound) {
                sound.volume = 1;
                sound.currentTime = 0;
                sound.play().catch(e => console.log("AutoPlay bloccato:", e));
            }
        });
        
        socket.on('stato-pacchi', (pacchi) => {
             const tuttiChiusi = pacchi.every(p => !p.aperto);
             if(tuttiChiusi) { creaTabellone(); }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regia - Affari Tuoi</title>
    <style>
        body { 
            background: #111; 
            color: white; 
            font-family: sans-serif; 
            padding: 15px; 
            margin: 0;
        }
        h2 { text-align: center; color: #00aaff; margin-top: 5px; }

        /* Griglia Pacchi */
        .grid-pacchi { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); /* 5 colonne per smartphone in orizzontale */
            gap: 8px; 
            margin-bottom: 20px; 
        }
        
        .btn-pacco {
            padding: 15px 5px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #fff;
            background: #4ab3f4; /* Celeste tipico dei pacchi */
            color: #000;
            cursor: pointer;
            text-align: center;
        }

        .btn-pacco.aperto {
            background: #333;
            border-color: #555;
            color: #888;
        }
        
        .valore-nascosto {
            display: block;
            font-size: 11px;
            color: #666; /* Poco visibile per te, ma utile */
            margin-top: 5px;
        }
        
        .btn-pacco:not(.aperto) .valore-nascosto {
            color: #000;
            opacity: 0.5;
        }

        /* Sezione Offerta */
        .pannello-controllo {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #cc0000;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="number"] {
            flex-grow: 1;
            padding: 12px;
            font-size: 18px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #fff;
        }

        .btn-azione {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .btn-invia-offerta { background: #cc0000; }
        .btn-nascondi-offerta { background: #555; }

        /* Soundboard */
        .soundboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-suono {
            background: #444;
            border: 1px solid #666;
            padding: 15px;
            font-size: 24px;
            border-radius: 8px;
        }

        /* Pulsante Nuova Partita */
        .btn-reset {
            width: 100%;
            padding: 15px;
            background: #ff8800;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>IL DOTTORE - REGIA</h2>
    
    <div id="griglia" class="grid-pacchi">
        <!-- Generati da JS -->
    </div>

    <div class="pannello-controllo">
        <h3>☎️ Gestione Offerta</h3>
        <div class="input-group">
            <input type="number" id="input-offerta" placeholder="Cifra in Euro...">
        </div>
        <div class="input-group">
            <button class="btn-azione btn-invia-offerta" style="flex:1" onclick="inviaOfferta()">MOSTRA OFFERTA</button>
            <button class="btn-azione btn-nascondi-offerta" style="flex:1" onclick="nascondiOfferta()">NASCONDI</button>
        </div>
    </div>

    <div class="pannello-controllo" style="border-left-color: #00aaff;">
        <h3>🎵 Effetti Audio (Su Display)</h3>
        <div class="soundboard">
            <button class="btn-azione btn-suono" onclick="suona('sigla')">🎼<br><span style="font-size:12px">Sigla</span></button>
            <button class="btn-azione btn-suono" onclick="suona('telefono')">☎️<br><span style="font-size:12px">Telefono</span></button>
            <button class="btn-azione btn-suono" onclick="suona('suspense')">🥁<br><span style="font-size:12px">Suspense</span></button>
        </div>
    </div>

    <button class="btn-reset" onclick="nuovaPartita()">🔄 AVVIA NUOVA PARTITA</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const formatEuro = (num) => "€ " + num.toLocaleString('it-IT');

        // Aggiorna Griglia
        socket.on('stato-pacchi', (pacchi) => {
            const griglia = document.getElementById('griglia');
            griglia.innerHTML = ''; 
            
            pacchi.forEach(pacco => {
                const btn = document.createElement('div');
                btn.className = `btn-pacco ${pacco.aperto ? 'aperto' : ''}`;
                
                // Formatta il bottone. Il valore è visibile piccolo in basso.
                btn.innerHTML = `
                    <div style="font-size: 20px;">${pacco.numeroPacco}</div>
                    <span class="valore-nascosto">${formatEuro(pacco.valore)}</span>
                `;
                
                if(!pacco.aperto) {
                    btn.onclick = () => {
                        if(confirm(`Confermi apertura Pacco ${pacco.numeroPacco}?`)) {
                            socket.emit('comando-apri-pacco', pacco.numeroPacco);
                        }
                    };
                }
                griglia.appendChild(btn);
            });
        });

        function inviaOfferta() {
            const cifra = document.getElementById('input-offerta').value;
            if(cifra) {
                socket.emit('comando-offerta', cifra);
                // svuota campo
                document.getElementById('input-offerta').value = '';
            }
        }

        function nascondiOfferta() {
            socket.emit('comando-nascondi-offerta');
        }

        function suona(tipo) {
            socket.emit('comando-audio', tipo);
        }

        function nuovaPartita() {
            if(confirm("Attenzione! Vuoi resettare tutto e rimescolare i pacchi per una nuova partita?")) {
                socket.emit('comando-nuova-partita');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affari Tuoi - Regia</title>
    <style>
        body { background: #333; color: white; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px; }
        button { padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; background: #0074D9; color: white; border: none; border-radius: 5px; }
        button:disabled { background: #555; cursor: not-allowed; }
        .dottore-box { background: #85144b; padding: 20px; border-radius: 10px; }
        input { padding: 10px; font-size: 16px; width: 60%; }
    </style>
</head>
<body>
    <h2>Regia Mobile</h2>
    
    <h3>Apri i Pacchi:</h3>
    <div id="griglia-pacchi" class="grid">
        <!-- I pulsanti vengono generati da JS -->
    </div>

    <div class="dottore-box">
        <h3>☎️ Offerta del Dottore</h3>
        <input type="number" id="input-offerta" placeholder="Inserisci cifra (es. 15000)">
        <button onclick="inviaOfferta()" style="background: white; color: black; width: 35%;">Invia al Display</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Riceve lo stato dei pacchi dal server e crea i bottoni
        socket.on('stato-pacchi', (pacchi) => {
            const griglia = document.getElementById('griglia-pacchi');
            griglia.innerHTML = ''; // Svuota la griglia
            
            pacchi.forEach(pacco => {
                const btn = document.createElement('button');
                // Mostra il numero. Tu, come conduttore, puoi vedere il valore per fare il Dottore!
                btn.innerText = `Pacco ${pacco.numeroPacco}\n(€ ${pacco.valore})`;
                btn.disabled = pacco.aperto;
                
                btn.onclick = () => {
                    if(confirm(`Sei sicuro di voler aprire il Pacco ${pacco.numeroPacco}?`)) {
                        socket.emit('comando-apri-pacco', pacco.numeroPacco);
                    }
                };
                griglia.appendChild(btn);
            });
        });

        function inviaOfferta() {
            const cifra = document.getElementById('input-offerta').value;
            if(cifra) {
                socket.emit('comando-offerta', cifra);
                document.getElementById('input-offerta').value = '';
            }
        }
    </script>
</body>
</html>
